<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scroll-spin house</title>
<style>
  :root{ --turns:1; }
  *{margin:0;box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:#faf8f2;color:#2c2c2a}
  .intro,.outro{height:90vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:0 20px}
  .intro h1{font-size:42px;font-weight:600;letter-spacing:-1px}
  .muted{color:#7a786f;font-size:15px}
  /* the spin section: tall, with a sticky stage */
  #spin{height:300vh;position:relative}
  #stage{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center}
  #frames{position:relative;width:100%;max-width:900px;aspect-ratio:16/9}
  #frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;will-change:opacity;user-select:none;-webkit-user-drag:none}
  #frames img:first-child{opacity:1}
  .hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font-size:13px;color:#7a786f;background:rgba(255,255,255,.7);padding:6px 14px;border-radius:20px;backdrop-filter:blur(4px)}
</style>
</head>
<body>
<section class="intro">
  <h1>Find your perfect space</h1>
  <p class="muted">Scroll down &mdash; the house turns to greet you.</p>
</section>

<section id="spin">
  <div id="stage">
    <div id="frames">
      <img src="./angle1.jpg" alt="house front" />
      <img src="./angle2.jpg" alt="" aria-hidden="true" />
      <img src="./angle3.jpg" alt="" aria-hidden="true" />
      <img src="./angle4.jpg" alt="" aria-hidden="true" />
    </div>
  </div>
</section>

<section class="outro">
  <p class="muted">&hellip;and the rest of your page continues here.</p>
</section>

<div class="hint">scroll to rotate</div>

<script>
(function(){
  var TURNS = 1, LOOP = true;
  var imgs = Array.from(document.querySelectorAll('#frames img'));
  var n = imgs.length;
  var section = document.getElementById('spin');

  function apply(progress){
    var pos = (progress * TURNS * n) % n;
    for(var i=0;i<n;i++){
      var d = Math.abs(((pos - i) % n + n) % n);
      if(LOOP && d > n/2) d = n - d;
      imgs[i].style.opacity = Math.max(0, 1 - d).toFixed(3);
    }
  }
  function onScroll(){
    var rect = section.getBoundingClientRect();
    var total = rect.height - window.innerHeight;
    var progress = Math.min(1, Math.max(0, -rect.top / total));
    apply(progress);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
})();
</script>
</body>
</html>
