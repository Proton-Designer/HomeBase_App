[build]
  base = "apps/mobile/"
  command = "cd ../.. && npm install --legacy-peer-deps && cd apps/mobile && npx expo export --platform web --output-dir dist"
  publish = "apps/mobile/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
